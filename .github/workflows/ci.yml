name: CI

on:
  push:
    branches: [main]
  pull_request:

# Valores fictícios, não segredos reais — só para satisfazer a validação
# de ambiente (lib/env.ts) durante o build e os testes E2E. Nenhum
# destes valores chega a um serviço externo real em CI (secção 19: não
# chamar APIs Google/Supabase reais na suíte normal de CI).
env:
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-service-role-key
  GOOGLE_OAUTH_CLIENT_ID: ci-client-id
  GOOGLE_OAUTH_CLIENT_SECRET: ci-client-secret
  GOOGLE_OAUTH_REDIRECT_URI: http://localhost:3000/api/google-drive/callback
  APP_ENCRYPTION_KEY: 01234567890123456789012345678901
  APP_TOKEN_PEPPER: 0123456789012345

jobs:
  check:
    name: Lint, typecheck, formatação, testes unitários e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências (lockfile fixo)
        run: pnpm install --frozen-lockfile

      - name: Lint + typecheck + formatação + testes unitários
        run: pnpm check

      - name: Build de produção
        run: pnpm build

  e2e:
    name: Testes E2E essenciais
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências (lockfile fixo)
        run: pnpm install --frozen-lockfile

      - name: Instalar o Chromium do Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build de produção
        run: pnpm build

      - name: Testes E2E
        run: pnpm test:e2e

      - name: Carregar relatório do Playwright em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
